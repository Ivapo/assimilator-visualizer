[package]
name = "assimilator-video"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Renders a video of one Assimilator simulation run"
repository = "https://github.com/Ivapo/assimilator-visualizer"
publish = false
default-run = "assimilator-video"

[dependencies]
# The engine, pinned (vis-001 §2.2.2). The rev is moved on purpose, by the user, in a
# commit of its own that re-runs the Phase 1 gates; scripts/fixture.sh reads it from here.
assimilator-config = { git = "https://github.com/Ivapo/assimilator.git", rev = "df8aec0" }
assimilator-core = { git = "https://github.com/Ivapo/assimilator.git", rev = "df8aec0" }
assimilator-geometry = { git = "https://github.com/Ivapo/assimilator.git", rev = "df8aec0" }
# Must be the engine's version: a ProjectConfig is deserialized from its serde_yaml::Value.
serde_yaml = "0.9"

bevy = { version = "0.19", default-features = false, features = [
    "std",
    "multi_threaded",
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    # `view` (vis-001 §2.9.7): the window, and the readout's text.
    "bevy_winit",
    "bevy_text",
    "default_font",
    "bevy_ui",
    "bevy_ui_render",
] }
arrow-array = "60"
arrow-schema = "60"
arrow-select = "60"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
# The keyframe file (vis-001 §2.11.6): TOML, read with serde.
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[profile.dev.package."*"]
debug = "line-tables-only"
